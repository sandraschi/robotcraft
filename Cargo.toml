[workspace]
members = [
    "crates/robotcraft-core",
    "crates/robotcraft-hal",
    "crates/robotcraft-mcp",
    "crates/robotcraft-app",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["sandraschi fleet <sandraschi@example.com>"]
license = "MIT"
repository = "https://github.com/sandraschi/robotcraft"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
eframe = "0.37"
egui = "0.37"
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "2.12", default-features = false, features = ["json"] }
roxmltree = "0.20"
databasecraft-store = { path = "../databasecraft/crates/databasecraft-store" }
databasecraft-core = { path = "../databasecraft/crates/databasecraft-core" }
